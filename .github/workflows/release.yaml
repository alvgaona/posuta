name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the history and the previous tag
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g npm@11.20.0 # npm stage needs a newer npm than Node 24 may ship
      - name: Check versions match the tag
        run: |
          for p in posuta create-posuta; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "$p is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm --filter @posuta/posuta exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
      # Before publishing, so a broken config stops the release before npm.
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      # npm, not pnpm: pnpm 11+ publishes without the README, so npmjs.com shows none.
      # Staged, not published: a maintainer approves each version with 2FA (npm stage approve).
      - run: npm stage publish --access public --provenance
        working-directory: packages/posuta
      - run: npm stage publish --access public --provenance
        working-directory: packages/create-posuta
      - run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
