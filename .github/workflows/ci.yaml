name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose  # new branch or force push: no range to compare
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter posuta exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm --filter posuta test
      - name: Export the template to PDF
        run: pnpm --filter posuta-template exec posuta pdf
      - uses: actions/upload-artifact@v7
        with:
          name: template-pdf
          path: template/dist/poster.pdf
