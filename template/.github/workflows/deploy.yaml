# Build the poster, export the PDF, and publish both to GitHub Pages.
# Turn Pages on once: Settings → Pages → Source: GitHub Actions.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm exec posuta install --with-deps
      - name: Build the site and the PDF
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm pdf
      - uses: actions/upload-artifact@v7
        with:
          name: poster
          path: dist/poster.pdf
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
